<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Auralis | Newsletter</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/auralis-logo.png">
  <style>
    :root{--navy:#0a1628;--navy2:#102641;--gold:#e8c96a;--blue:#81b0e5;--ink:#122033;--muted:#657386;--line:#e5eaf0}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,Arial,Helvetica,sans-serif;background:#f4f6f8;color:var(--ink)}
    body{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 15% 10%,rgba(129,176,229,.17),transparent 34%),#f4f6f8}
    .card{width:min(940px,100%);background:#fff;border-radius:34px;overflow:hidden;box-shadow:0 28px 80px rgba(10,22,40,.15);display:grid;grid-template-columns:1fr 1fr;min-height:560px}
    .visual{position:relative;min-height:420px;background:var(--navy)}
    .visual img.hero{width:100%;height:100%;object-fit:cover;display:block;opacity:.76}
    .visual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,22,40,.05),rgba(10,22,40,.76))}
    .brand{position:absolute;z-index:2;left:34px;top:30px;width:155px;height:auto}
    .visual-copy{position:absolute;z-index:2;left:34px;right:34px;bottom:34px;color:#fff}
    .visual-copy span{font-size:10px;letter-spacing:2.8px;text-transform:uppercase;color:var(--gold);font-weight:800}
    .visual-copy p{margin:12px 0 0;font-size:16px;line-height:1.55;color:rgba(255,255,255,.82)}
    .content{padding:54px 52px;display:flex;flex-direction:column;justify-content:center}
    .icon{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:#eef5fc;color:var(--navy);font-weight:900;font-size:22px;margin-bottom:26px}
    .kicker{font-size:10px;letter-spacing:2.6px;text-transform:uppercase;color:#ae8a28;font-weight:800;margin-bottom:10px}
    h1{font-size:42px;line-height:1.02;letter-spacing:-1.7px;margin:0;color:var(--navy)}
    p{font-size:15px;line-height:1.72;color:var(--muted);margin:18px 0 0}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
    a{display:inline-flex;align-items:center;justify-content:center;padding:14px 21px;border-radius:999px;text-decoration:none;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:850}
    .primary{background:var(--navy);color:#fff}.primary:hover{background:var(--navy2)}
    .secondary{border:1px solid var(--line);color:var(--navy);background:#fff}
    .small{font-size:11px;color:#99a3af;margin-top:34px}
    @media(max-width:760px){body{padding:12px}.card{grid-template-columns:1fr;border-radius:26px}.visual{min-height:270px}.content{padding:38px 28px 42px}h1{font-size:34px}.visual-copy{display:none}.brand{left:24px;top:24px;width:135px}}
  </style>
  <script src="/assets/auralis-consent.js"></script>
</head>
<body>
  <main class="card">
    <section class="visual" aria-hidden="true">
      <img class="hero" src="/assets/jet_door_opening.jpg" alt="">
      <img class="brand" src="/auralis-logo.png" alt="Auralis">
      <div class="visual-copy"><span>Auralis Updates</span><p>Rotte selezionate, disponibilità Empty Leg e storie dal Journal.</p></div>
    </section>
    <section class="content">
      <div class="icon" id="status-icon">✓</div>
      <div class="kicker" id="status-kicker">Newsletter</div>
      <h1 id="status-title">Operazione completata.</h1>
      <p id="status-copy">La tua preferenza è stata aggiornata correttamente.</p>
      <div class="actions">
        <a class="primary" href="/" id="primary-action">Torna alla home</a>
        <a class="secondary" href="/journal/" id="secondary-action">Scopri il Journal</a>
      </div>
      <div class="small" id="status-small">Auralis SkyShare</div>
    </section>
  </main>
  <script>
    (function(){
      const status=new URLSearchParams(location.search).get('status')||'confirmed';
      const content={
        confirmed:{icon:'✓',kicker:'Iscrizione confermata',title:'Benvenuta/o in Auralis.',copy:'Il tuo indirizzo è stato confermato. Da questo momento riceverai gli aggiornamenti Auralis selezionati per te.',small:'La welcome email è già in viaggio verso la tua inbox.'},
        unsubscribed:{icon:'✓',kicker:'Preferenze aggiornate',title:'Iscrizione annullata.',copy:'Non riceverai più gli aggiornamenti Auralis a questo indirizzo. Potrai iscriverti nuovamente in qualsiasi momento dal sito.',small:'La disiscrizione è stata registrata correttamente.'},
        expired:{icon:'↻',kicker:'Link scaduto',title:'Serve un nuovo link.',copy:'Il link di conferma non è più valido. Inserisci nuovamente la tua email nel form newsletter per riceverne uno nuovo.',small:'Per sicurezza, i link di conferma hanno una durata limitata.'},
        'invalid-confirmation':{icon:'!',kicker:'Link non valido',title:'Non riusciamo a confermare l’iscrizione.',copy:'Il link utilizzato non è valido. Torna sul sito e ripeti l’iscrizione per ricevere una nuova email di conferma.',small:'Nessuna iscrizione è stata modificata.'},
        'invalid-unsubscribe':{icon:'!',kicker:'Link non valido',title:'Non riusciamo ad aggiornare l’iscrizione.',copy:'Il link di annullamento non è valido o è incompleto.',small:'Se continui a ricevere comunicazioni, usa il link presente nell’ultima email Auralis.'},
        'not-found':{icon:'!',kicker:'Iscrizione non trovata',title:'Il link non è più attivo.',copy:'Questa iscrizione potrebbe essere già stata annullata oppure il link potrebbe essere stato sostituito.',small:'Non sono necessarie altre azioni.'}
      };
      const x=content[status]||content.confirmed;
      document.getElementById('status-icon').textContent=x.icon;
      document.getElementById('status-kicker').textContent=x.kicker;
      document.getElementById('status-title').textContent=x.title;
      document.getElementById('status-copy').textContent=x.copy;
      document.getElementById('status-small').textContent=x.small;
      if(status==='unsubscribed'||status==='not-found'||status==='invalid-unsubscribe'){
        document.getElementById('secondary-action').textContent='Torna al Journal';
      }
    })();
  </script>
</body>
</html>
